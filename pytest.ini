[pytest]
testpaths = tests
python_files = test_*.py verify_*.py benchmark_*.py demonstration_*.py
filterwarnings =
    # Classify harmless dependency deprecation in Joblib 1.4.2 under NumPy 2.x
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5:DeprecationWarning:joblib.numpy_pickle
