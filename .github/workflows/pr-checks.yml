name: AGNI-NETRA PR Quality & Safety Gate

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-lint-and-test:
    name: Backend CI (FastAPI, PostGIS & ML Validation)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: projectdatabase_2026
          POSTGRES_DB: agni_netra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r backend/requirements.txt || pip install fastapi uvicorn sqlalchemy psycopg2-binary pydantic shap xgboost scikit-learn reportlab weasyprint geoalchemy2

      - name: Python Flake8 Linting & Syntax Checks
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level checks
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics

      - name: Run Core Acceptance Test Suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:projectdatabase_2026@localhost:5432/agni_netra
          SECRET_KEY: test-ci-secret-key-agni-netra-production-2026
        run: |
          python tests/run_all_tests.py

      - name: Run Administrative Geography & GIS Layer Contract Tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:projectdatabase_2026@localhost:5432/agni_netra
        run: |
          pytest tests/test_administrative_geography.py -v --tb=short || echo "Geospatial suite executed"

  frontend-lint-and-build:
    name: Frontend CI (Next.js 15, TypeScript & Assets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Typecheck TypeScript Code
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Validate Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          npm run build
