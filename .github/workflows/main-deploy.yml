name: AGNI-NETRA Main Branch Production Deployment Pipeline

on:
  push:
    branches: [main, master]

jobs:
  full-system-regression:
    name: Full System Regression & Production Certification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: projectdatabase_2026
          POSTGRES_DB: agni_netra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || pip install fastapi uvicorn sqlalchemy psycopg2-binary pydantic shap xgboost scikit-learn reportlab weasyprint geoalchemy2 pytest pytest-cov

      - name: Run Complete 7-Stage Acceptance Suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:projectdatabase_2026@localhost:5432/agni_netra
          SECRET_KEY: production-deploy-secret-key-agni-netra-2026
        run: |
          python tests/run_all_tests.py

  build-and-package:
    name: Package Backend Container & Frontend Artifact
    needs: full-system-regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://agni-netra-api.onrender.com/api/v1
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Archive Production Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agni-netra-frontend-dist
          path: frontend/.next/
          retention-days: 7

      - name: Validate Render & Vercel Deployment Manifests
        run: |
          test -f render.yaml && echo "render.yaml validated"
          test -f vercel.json || test -f frontend/vercel.json && echo "vercel.json validated"

      - name: Validate Backend Docker Container Build
        run: |
          docker build -t agni-netra-backend:ci -f deployment/Dockerfile.backend .
